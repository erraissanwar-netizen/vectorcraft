name: Build SVGCode VectorCraft Web WASM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-wasm:
    name: Compile WebAssembly Runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout craft-fonts
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: abb83316d96aa59c1cf64784289e378fe9fa5695
          path: craft-fonts

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: vectorcraft-wasm

      - name: Install Trunk build tool
        run: |
          TRUNK_VERSION=0.21.14
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.cargo/bin" trunk
          trunk --version

      - name: Compile WASM Bundle
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: |
          cd apps/vectorcraft-web
          trunk build --release

      - name: Package Runtime Bundle
        run: |
          mkdir -p dist-runtime
          cp -r dist/web/* dist-runtime/
          cd dist-runtime
          tar -czvf ../vectorcraft-web-runtime.tar.gz *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vectorcraft-wasm-runtime
          path: dist-runtime/*
          if-no-files-found: error
